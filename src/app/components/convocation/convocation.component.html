<app-layout></app-layout>
<div class="space-y-6 ml-80 mt-6 mr-6">
  <h1 class="text-2xl font-bold text-gray-900">Convocations</h1>
  <div class="bg-white rounded-lg shadow-sm p-4">
    <ul class="space-y-2">
      <li *ngFor="let convocation of convocations" class="border-b pb-2">
        {{ convocation['motif'] || convocation['id'] }}
      </li>
      <li *ngIf="!convocations.length" class="text-gray-500">Aucune convocation.</li>
    </ul>
  </div>
</div>
