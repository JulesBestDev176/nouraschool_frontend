<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-2xl mx-auto bg-white shadow rounded-lg p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-4">Consultation bulletin</h1>
    <div class="mb-4">
      <label class="block text-sm text-gray-700 mb-1">Code OTP</label>
      <input [(ngModel)]="otp" type="text" class="w-full border rounded px-3 py-2" />
      <button (click)="verifyOtp()" class="mt-2 px-4 py-2 bg-green-600 text-white rounded">Verifier OTP</button>
    </div>
    <p *ngIf="error" class="text-red-600 text-sm mb-3">{{ error }}</p>
    <pre class="text-sm bg-gray-100 rounded p-3 whitespace-pre-wrap">{{ bulletin | json }}</pre>
  </div>
</div>
