<div class="noura-shell bg-gradient-to-br from-green-50 to-yellow-100 text-gray-800">
  <aside
    #sidebarContainer
    (scroll)="onSidebarScroll($event)"
    class="noura-sidebar fixed inset-y-0 left-0 z-50 w-64 bg-white shadow-lg flex flex-col overflow-y-auto"
  >
    <div class="p-6 border-b border-gray-200 bg-white">
      <div class="flex items-center mb-4">
        <img src="../../../assets/images/logo.png" alt="Logo &Eacute;cole NOURA" class="h-12 w-12 object-contain mr-3" />
        <div class="min-w-0">
          <h1 class="text-lg font-bold text-gray-900 leading-tight">NOURA</h1>
          <p class="text-xs text-green-700 leading-snug">{{ getUserTypeLabel() }}</p>
        </div>
      </div>

      <div *ngIf="currentUser">
        <p class="text-sm text-gray-600 truncate">{{ currentUser.prenom }} {{ currentUser.nom }}</p>
        <p class="text-xs text-gray-500 truncate">Nouakchott, Mauritanie</p>
      </div>
    </div>

    <nav class="mt-6 flex-1 pb-6">
      <div class="px-3">
        <ng-container *ngFor="let item of topLevelItems">
          <a
            href=""
            (click)="onMenuClick($event, item.route)"
            [class]="(isActiveRoute(item.route) ? 'bg-green-100 text-green-900 font-medium border-r-2 border-green-600' : 'text-gray-700 hover:text-gray-900 hover:bg-gray-50') + ' w-full flex items-center px-2 py-2 text-sm rounded-md mb-1 transition-colors duration-150 ease-in-out'"
          >
            <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
            </svg>
            <span class="truncate">{{ item.label }}</span>
            <span *ngIf="item.badge" class="ml-auto bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">{{ item.badge }}</span>
          </a>
        </ng-container>

        <ng-container *ngFor="let section of adminSections">
          <div class="mt-4 mb-1 px-2">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">{{ section }}</p>
          </div>
          <ng-container *ngFor="let item of getItemsForSection(section)">
            <a
              href=""
              (click)="onMenuClick($event, item.route)"
              [class]="(isActiveRoute(item.route) ? 'bg-green-100 text-green-900 font-medium border-r-2 border-green-600' : 'text-gray-700 hover:text-gray-900 hover:bg-gray-50') + ' w-full flex items-center px-2 py-2 text-sm rounded-md mb-1 transition-colors duration-150 ease-in-out'"
            >
              <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
              </svg>
              <span class="truncate">{{ item.label }}</span>
            </a>
          </ng-container>
        </ng-container>

        <div class="mt-4 mb-1 px-2">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Compte</p>
        </div>
        <a
          href=""
          (click)="onMenuClick($event, '/admin/profil')"
          [class]="(isActiveRoute('/admin/profil') ? 'bg-green-100 text-green-900 font-medium border-r-2 border-green-600' : 'text-gray-700 hover:text-gray-900 hover:bg-gray-50') + ' w-full flex items-center px-2 py-2 text-sm rounded-md mb-1 transition-colors duration-150 ease-in-out'"
        >
          <svg class="w-5 h-5 mr-3 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Mon Profil</span>
        </a>
      </div>
    </nav>

  </aside>

  <header class="noura-header fixed top-0 left-64 right-0 z-40 bg-white shadow-sm border-b border-gray-200">
    <div class="px-6 py-4 flex items-center justify-between gap-4">
      <div class="min-w-0">
        <h2 class="text-lg font-semibold text-gray-900 truncate">{{ getCurrentPageTitle() }}</h2>
        <p class="text-sm text-gray-600 mt-1 truncate">&Eacute;cole NOURA - Nouakchott, Mauritanie</p>
      </div>

      <button
        (click)="onLogout()"
        class="flex flex-shrink-0 items-center px-3 py-2 text-sm font-medium text-red-600 hover:text-red-700 hover:bg-red-50 rounded-md transition-colors duration-150 ease-in-out"
      >
        <svg class="mr-2 w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        D&eacute;connexion
      </button>
    </div>
  </header>
</div>
