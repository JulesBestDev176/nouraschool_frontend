<aside class="sidebar" #sidebarContainer (scroll)="onSidebarScroll($event)">

  <!-- Brand -->
  <div class="sidebar-brand">
    <div class="brand-avatar">N</div>
    <div>
      <div class="brand-name">Noura School</div>
      <div class="brand-role">{{ getUserTypeLabel() }}</div>
    </div>
  </div>

  <!-- Nav -->
  <nav class="sidebar-nav">

    <!-- Top-level items -->
    <ng-container *ngFor="let item of topLevelItems">
      <button class="nav-item" [class.active]="isActiveRoute(item.route)"
        (click)="navigateToRoute(item.route)">
        <lucide-angular [img]="item.icon" [size]="15"></lucide-angular>
        <span>{{ item.label }}</span>
        <span *ngIf="item.badge" class="nav-badge">{{ item.badge }}</span>
      </button>
    </ng-container>

    <!-- Sectioned items -->
    <ng-container *ngFor="let section of adminSections">
      <div class="nav-section-label">{{ section }}</div>
      <ng-container *ngFor="let item of getItemsForSection(section)">
        <button class="nav-item" [class.active]="isActiveRoute(item.route)"
          (click)="navigateToRoute(item.route)">
          <lucide-angular [img]="item.icon" [size]="15"></lucide-angular>
          <span>{{ item.label }}</span>
        </button>
      </ng-container>
    </ng-container>

    <!-- Compte -->
    <div class="nav-section-label">Compte</div>
    <button class="nav-item" [class.active]="isActiveRoute('/admin/profil')"
      (click)="navigateToRoute('/admin/profil')">
      <lucide-angular [img]="profileIcon" [size]="15"></lucide-angular>
      <span>Mon Profil</span>
    </button>

  </nav>

  <!-- Footer -->
  <div class="sidebar-footer">
    <div class="user-info" *ngIf="currentUser">
      <div class="user-avatar">{{ getUserInitials() }}</div>
      <div>
        <div class="user-name">{{ currentUser.prenom }} {{ currentUser.nom }}</div>
        <div class="user-role">{{ getUserTypeLabel() }}</div>
      </div>
    </div>
    <button class="logout-btn" (click)="onLogout()">
      <lucide-angular [img]="logoutIcon" [size]="15"></lucide-angular>
      Déconnexion
    </button>
  </div>

</aside>
