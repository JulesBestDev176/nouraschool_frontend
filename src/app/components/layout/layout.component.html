<div class="bg-[#f9fef3] text-gray-800">
  <!-- SIDEBAR -->
  <aside
    #sidebarContainer
    (scroll)="onSidebarScroll($event)"
    class="w-72 bg-white border-r shadow-sm flex flex-col justify-between fixed left-0 top-0 h-full overflow-y-auto"
  >
    <div>
      <!-- Logo -->
      <div class="flex items-center gap-3 px-5 py-4 border-b sticky top-0 bg-white z-10">
        <div class="w-10 h-10 rounded-full bg-green-600 flex items-center justify-center text-white font-bold text-lg">N</div>
        <div>
          <h1 class="font-bold text-gray-900 text-base">Noura School</h1>
          <p class="text-xs text-green-700">{{ getUserTypeLabel() }}</p>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="mt-2 pb-4">

        <!-- Tableau de bord (tous rôles) -->
        <ng-container *ngFor="let item of topLevelItems">
          <button
            (click)="navigateToRoute(item.route)"
            [class]="(isActiveRoute(item.route) ? 'bg-green-50 text-green-700 font-medium border-r-2 border-green-600' : 'text-gray-700 hover:bg-gray-50') + ' w-full flex items-center gap-3 px-5 py-2.5 text-sm transition-colors'"
          >
            <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
            </svg>
            <span>{{ item.label }}</span>
            <span *ngIf="item.badge" class="ml-auto bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5">{{ item.badge }}</span>
          </button>
        </ng-container>

        <!-- Sections Admin -->
        <ng-container *ngFor="let section of adminSections">
          <div class="mt-3 mb-1 px-5">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">{{ section }}</p>
          </div>
          <ng-container *ngFor="let item of getItemsForSection(section)">
            <button
              (click)="navigateToRoute(item.route)"
              [class]="(isActiveRoute(item.route) ? 'bg-green-50 text-green-700 font-medium border-r-2 border-green-600' : 'text-gray-600 hover:bg-gray-50') + ' w-full flex items-center gap-3 px-5 py-2 text-sm transition-colors'"
            >
              <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" [attr.d]="item.icon" />
              </svg>
              <span>{{ item.label }}</span>
            </button>
          </ng-container>
        </ng-container>

        <!-- Profil -->
        <div class="mt-3 mb-1 px-5">
          <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Compte</p>
        </div>
        <button
          (click)="navigateToRoute('/admin/profil')"
          [class]="(isActiveRoute('/admin/profil') ? 'bg-green-50 text-green-700 font-medium border-r-2 border-green-600' : 'text-gray-600 hover:bg-gray-50') + ' w-full flex items-center gap-3 px-5 py-2 text-sm transition-colors'"
        >
          <svg class="w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
          <span>Mon Profil</span>
        </button>
      </nav>
    </div>

    <!-- Avatar + Déconnexion -->
    <div class="border-t p-4 sticky bottom-0 bg-white">
      <div class="flex items-center gap-3 mb-3" *ngIf="currentUser">
        <div class="w-9 h-9 rounded-full bg-green-100 flex items-center justify-center text-green-700 font-semibold text-sm">
          {{ getUserInitials() }}
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-gray-900 truncate">{{ currentUser.prenom }} {{ currentUser.nom }}</p>
          <p class="text-xs text-gray-500 truncate">{{ getUserTypeLabel() }}</p>
        </div>
      </div>
      <button (click)="onLogout()" class="w-full flex items-center gap-2 text-red-600 hover:text-red-800 text-sm transition py-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg>
        Déconnexion
      </button>
    </div>
  </aside>
</div>
