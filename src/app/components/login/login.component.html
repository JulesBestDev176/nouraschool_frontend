<div class="login-page">

  <div class="login-bg"></div>
  <div class="login-overlay"></div>

  <div class="login-card">

    <div class="login-header">
      <img src="../../../assets/images/logo.png" alt="Logo" class="login-logo" />
      <h1>École NOURA</h1>
      <p>Connectez-vous à votre espace</p>
    </div>

    <div class="login-form">

      <div class="field">
        <label>Adresse email</label>
        <div class="input-wrapper">
          <lucide-angular [img]="mailIcon" [size]="16" class="input-icon"></lucide-angular>
          <input pInputText type="email" [(ngModel)]="email" placeholder="votre@email.mr" />
        </div>
      </div>

      <div class="field">
        <label>Mot de passe</label>
        <div class="input-wrapper password-wrapper">
          <lucide-angular [img]="lockIcon" [size]="16" class="input-icon"></lucide-angular>
          <p-password [(ngModel)]="password" [feedback]="false" [toggleMask]="true"
            placeholder="Votre mot de passe">
          </p-password>
        </div>
      </div>

      <div class="error-msg" *ngIf="errorMsg">
        <lucide-angular [img]="alertIcon" [size]="14"></lucide-angular>
        {{ errorMsg }}
      </div>

      <button class="submit-btn" (click)="onSubmit()" [disabled]="isLoading">
        {{ isLoading ? 'Connexion…' : 'Se connecter' }}
      </button>

    </div>

    <a routerLink="/home" class="back-link">
      <lucide-angular [img]="arrowLeftIcon" [size]="13"></lucide-angular>
      Retour à l'accueil
    </a>

  </div>

</div>
