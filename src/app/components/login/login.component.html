<main class="login-page">
  <div class="theme-container">
    <div class="login-row" fxLayout="row" fxLayoutAlign="center center">
      <mat-card class="login-card">
        <div fxLayout="column" fxLayoutAlign="center center" class="login-header text-center">
          <img src="assets/images/logo.png" alt="Logo Noura School" class="login-logo" />
          <h1 class="uppercase">Connexion</h1>
          <a mat-button routerLink="/" class="login-home-link">Retour a l'accueil</a>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <mat-form-field class="w-full mt-2 login-field">
            <mat-label>Identifiant</mat-label>
            <mat-icon matPrefix>person</mat-icon>
            <input
              matInput
              formControlName="login"
              placeholder="Ex. admin@noura.school"
              autocomplete="username"
              required
            />
            <mat-error *ngIf="loginForm.controls.login.errors?.['required']">
              L'identifiant est requis.
            </mat-error>
          </mat-form-field>

          <mat-form-field class="w-full mt-1 login-field">
            <mat-label>Mot de passe</mat-label>
            <mat-icon matPrefix>lock</mat-icon>
            <input
              matInput
              formControlName="password"
              [type]="hidePassword ? 'password' : 'text'"
              placeholder="Ex. minimum 6 caracteres"
              autocomplete="current-password"
              required
            />
            <mat-error *ngIf="loginForm.controls.password.errors?.['required']">
              Le mot de passe est requis.
            </mat-error>
            <mat-error *ngIf="loginForm.controls.password.hasError('minlength')">
              Le mot de passe doit contenir au moins 6 caracteres.
            </mat-error>
            <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </mat-form-field>

          <div class="remember-row">
            <mat-checkbox formControlName="remember">Se souvenir de moi</mat-checkbox>
          </div>

          <div *ngIf="errorMsg" class="error-box" role="alert">
            <mat-icon>error_outline</mat-icon>
            <span>{{ errorMsg }}</span>
          </div>

          <div class="text-center mt-2">
            <div class="submit-wrap">
              <mat-spinner *ngIf="isLoading" diameter="42"></mat-spinner>
              <button
                *ngIf="!isLoading"
                mat-raised-button
                class="submit-button uppercase"
                type="submit"
                [disabled]="loginForm.invalid"
              >
                <span>Se connecter</span>
              </button>
            </div>
          </div>
        </form>
      </mat-card>
    </div>
  </div>
</main>
