<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-2xl mx-auto bg-white shadow rounded-lg p-6">
    <h1 class="text-2xl font-bold text-gray-900 mb-4">Paiement public</h1>
    <p *ngIf="error" class="text-red-600 text-sm mb-3">{{ error }}</p>
    <pre class="text-sm bg-gray-100 rounded p-3 whitespace-pre-wrap mb-3">{{ detail | json }}</pre>
    <button (click)="payer()" class="px-4 py-2 bg-green-600 text-white rounded">Payer</button>
  </div>
</div>
