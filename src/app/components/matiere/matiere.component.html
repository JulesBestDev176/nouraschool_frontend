<app-layout></app-layout>
<div class="space-y-6 ml-80 mt-6 mr-6">
  <!-- En-tête -->
  <div class="flex justify-between items-center">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">Gestion des Matières</h1>
      <p class="text-gray-600 mt-1">3 matière(s) configurée(s)</p>
    </div>
    <button (click)="openModal()"
      class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg flex items-center space-x-2 transition-colors duration-200">
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
      </svg>
      <span>Nouvelle matière</span>
    </button>
  </div>

  <!-- Filtres et recherche -->
  <div class="bg-white p-4 rounded-lg shadow-sm space-y-4">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Rechercher</label>
        <input type="text" placeholder="Nom, code ou description..."
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Personnel</label>
        <select
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
          <option value="">Tout le personnel</option>
          <option value="1">Alice Dupont</option>
          <option value="2">Bob Martin</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Grille des matières -->
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <div *ngFor="let matiere of matieres" class="bg-white rounded-lg shadow-md hover:shadow-lg transition-shadow duration-200">
      <div class="p-6">
        <div class="flex justify-between items-start mb-4">
          <div>
            <h3 class="text-lg font-semibold text-gray-900">{{ matiere.nom }}</h3>
            <p class="text-sm text-gray-600 font-mono">{{ matiere.code }}</p>
          </div>
          <div class="flex space-x-1">
            <button class="p-1 text-blue-600 hover:text-blue-700">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
            <button class="p-1 text-indigo-600 hover:text-indigo-700">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
              </svg>
            </button>
            <button class="p-1 text-red-600 hover:text-red-700">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          </div>
        </div>

        <div class="space-y-3">
          <div class="border-t border-gray-100 pt-3">
            <p class="text-sm text-gray-600 mb-2">Description</p>
            <p class="text-sm text-gray-900 line-clamp-2">{{ matiere.description || '-' }}</p>
          </div>

          <div class="flex items-center bg-gray-50 rounded-md p-2">
            <svg class="w-4 h-4 text-gray-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            <span class="text-sm text-gray-700">{{ matiere.enseignantIds[0] || '-' }}</span>
          </div>
        </div>
      </div>
    </div>
    <div *ngIf="!matieres.length" class="text-gray-500">Aucune matiere disponible.</div>
  </div>
</div>


<!-- Modal ajout/modification -->
<div *ngIf="isModalOpen" (click)="closeModal()" class="fixed inset-0 bg-gray-600  overflow-y-auto h-full w-full z-50">
  <div class="relative top-10 mx-auto p-5 border w-full max-w-lg shadow-lg rounded-md bg-white"
    (click)="$event.stopPropagation()">
    <div class="mt-3">
      <h3 class="text-lg text-gray-900 mb-4">
        <!-- {{isEditing ? 'Modifier' : 'Créer'}} -->
        Créer une matière
      </h3>

      <form class="space-y-4">
        <div>
          <label class="block text-sm text-gray-700 mb-1">Nom de la matière *</label>
          <input type="text" formControlName="nom" placeholder="Ex: Mathématiques"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
          <!-- <div *ngIf="matiereForm.get('nom')?.invalid && matiereForm.get('nom')?.touched" class="text-red-600 text-sm mt-1">
                  Nom requis
                </div> -->
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Code *</label>
          <input type="text" formControlName="code" placeholder="Ex: MATH"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500" />
          <!-- <div *ngIf="matiereForm.get('code')?.invalid && matiereForm.get('code')?.touched" class="text-red-600 text-sm mt-1">
                  Code requis
                </div> -->
        </div>


        <div>
          <label class="block text-sm text-gray-700 mb-1">Description</label>
          <textarea formControlName="description" rows="3" placeholder="Description de la matière..."
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
                </textarea>
        </div>

        <div>
          <label class="block text-sm text-gray-700 mb-1">Personnel responsable *</label>
          <select formControlName="enseignantId"
            class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500">
            <option value="">Sélectionner un membre du personnel</option>
            <!-- <option *ngFor="let enseignant of enseignants" [value]="enseignant.id">
                    {{enseignant.prenom}} {{enseignant.nom}}
                  </option> -->
          </select>
          <!-- <div *ngIf="matiereForm.get('enseignantId')?.invalid && matiereForm.get('enseignantId')?.touched" class="text-red-600 text-sm mt-1">
                  Personnel requis
                </div> -->
        </div>

        <div class="flex justify-end space-x-3 pt-4 border-t">
          <button type="button" (click)="closeModal()"
            class="px-4 py-2 text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition-colors">
            Annuler
          </button>
          <button type="submit"
            class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
            <!-- {{isEditing ? 'Modifier' : 'Créer'}} -->
            Créer
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
