<app-layout></app-layout>
<div class="space-y-6 ml-80 mt-6 mr-6">
  <h1 class="text-2xl font-bold text-gray-900">Absences eleves</h1>
  <div class="bg-white rounded-lg shadow-sm p-4">
    <ul class="space-y-2">
      <li *ngFor="let absence of absences" class="border-b pb-2">
        {{ absence['motif'] || absence['id'] }}
      </li>
      <li *ngIf="!absences.length" class="text-gray-500">Aucune absence.</li>
    </ul>
  </div>
</div>
