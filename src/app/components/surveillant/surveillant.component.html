<app-layout></app-layout>
<div class="space-y-6 ml-80 mt-6 mr-6">
  <h1 class="text-2xl font-bold text-gray-900">Surveillance</h1>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    <div class="bg-white rounded-lg shadow-sm p-4">
      <h2 class="text-lg font-semibold mb-3">Absences eleves</h2>
      <ul class="space-y-2">
        <li *ngFor="let absence of absences" class="border-b pb-2">{{ absence | json }}</li>
        <li *ngIf="!absences.length" class="text-gray-500">Aucune absence.</li>
      </ul>
    </div>
    <div class="bg-white rounded-lg shadow-sm p-4">
      <h2 class="text-lg font-semibold mb-3">Convocations</h2>
      <ul class="space-y-2">
        <li *ngFor="let convocation of convocations" class="border-b pb-2">{{ convocation | json }}</li>
        <li *ngIf="!convocations.length" class="text-gray-500">Aucune convocation.</li>
      </ul>
    </div>
  </div>
</div>
