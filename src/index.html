<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>École NOURA - Système de Gestion Scolaire</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Système de gestion scolaire complet pour l'École NOURA - Gestion des élèves, enseignants, notes et paiements">
  <meta name="keywords" content="école, gestion scolaire, notes, bulletins, paiements, Mauritanie, Nouakchott">
  <meta name="author" content="Mohameden EL Atigh Seyid - Ingénieur logiciel">
  
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- PWA Configuration -->
  <meta name="theme-color" content="#059669">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="École NOURA">
  
  <!-- Open Graph Tags -->
  <meta property="og:title" content="École NOURA - Système de Gestion Scolaire">
  <meta property="og:description" content="Plateforme numérique moderne pour la gestion complète de l'École NOURA">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="fr_FR">
  
  <!-- Custom Styles -->
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
    
    .loader {
      width: 48px;
      height: 48px;
      display: inline-block;
      position: relative;
    }

    .loader::after,
    .loader::before {
      content: '';
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #fff;
      position: absolute;
      left: 0;
      top: 0;
      box-sizing: border-box;
      animation: animloader 2s ease-in-out infinite;
    }

    .loader::after {
      animation-delay: 1s;
    }

    @keyframes animloader {
      0%, 100% {
        transform: scale(0);
        opacity: 1;
      }
      50% {
        transform: scale(1);
        opacity: 0;
      }
    }
    
    /* Smooth transitions */
    * {
      transition: all 0.2s ease-in-out;
    }
    
    /* Scroll behavior */
    html {
      scroll-behavior: smooth;
    }
    
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
    }
    
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    ::-webkit-scrollbar-thumb {
      background: #c1c1c1;
      border-radius: 3px;
    }
    
    ::-webkit-scrollbar-thumb:hover {
      background: #a8a8a8;
    }
  </style>
</head>
<body class="bg-[#e6f6c9] text-gray-800">

  <!-- App Root -->
  <app-root>
    <!-- Loading Screen -->
    <div class="min-h-screen flex items-center justify-center bg-gray-950">
      <div class="loader" aria-label="Chargement"></div>
    </div>
  </app-root>
  
</body>
</html>
